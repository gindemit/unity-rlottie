name: Unity platform test matrix

on:
  workflow_dispatch:
    inputs:
      run_physical_firebase_device:
        description: Run latest Android pipelines on Firebase physical devices and Windows pipelines on hosted runners
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - dev
      - 'unity/**'
  push:
    branches:
      - dev

concurrency:
  group: unity-platform-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unity_tests:
    name: Unity EditMode and PlayMode tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: unity/RLottieUnity/Library
          key: unity-library-${{ runner.os }}-${{ hashFiles('unity/RLottieUnity/Packages/**', 'unity/RLottieUnity/ProjectSettings/**') }}
          restore-keys: unity-library-${{ runner.os }}-

      - name: Prepare Unity test image
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag rlottie-unity-tests:local -f - . <<'DOCKERFILE'
          FROM unityci/editor:ubuntu-2022.3.62f3-linux-il2cpp-3
          RUN apt-get update \
              && DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends build-essential cmake libgl-dev \
              && rm -rf /var/lib/apt/lists/*
          DOCKERFILE

      - name: Build and verify Linux native plugin
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash \
            --volume "${GITHUB_WORKSPACE}:/github/workspace" \
            --workdir /github/workspace \
            rlottie-unity-tests:local -lc '
              cmake -S projects/CMake -B build/linux \
                -DCMAKE_BUILD_TYPE=Release \
                -DRLOTTIE_LINUX=ON
              cmake --build build/linux --config Release --parallel
              install -m 755 \
                "$(find build/linux -type f -name libLottiePlugin.so -print -quit)" \
                unity/RLottieUnity/Assets/LottiePlugin/Plugins/Linux/x86_64/libLottiePlugin.so
              ldd unity/RLottieUnity/Assets/LottiePlugin/Plugins/Linux/x86_64/libLottiePlugin.so | tee /tmp/ldd.txt
              ! grep -q "not found" /tmp/ldd.txt
            '

      - name: Run Unity tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          customImage: rlottie-unity-tests:local
          projectPath: unity/RLottieUnity
          testMode: all
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity tests (${{ github.ref_name }})

      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results-${{ github.run_id }}
          path: test-results
          if-no-files-found: warn

  build_players:
    name: Build ${{ matrix.name }} player
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows64
            target_platform: StandaloneWindows64
            ci_target: Windows64
            graphics_api: Auto
            output: artifacts/windows/RLottieSmoke.exe
            artifact_path: artifacts/windows
            artifact: rlottie-windows-${{ github.run_id }}
          - name: Linux Vulkan
            target_platform: StandaloneLinux64
            ci_target: Linux64
            graphics_api: Vulkan
            output: artifacts/linux/RLottieSmoke.x86_64
            artifact_path: artifacts/linux
            artifact: rlottie-linux-vulkan-${{ github.run_id }}
          - name: Android Vulkan
            target_platform: Android
            ci_target: Android
            graphics_api: Vulkan
            output: artifacts/android/RLottieSmoke.apk
            artifact_path: artifacts/android/RLottieSmoke.apk
            artifact: rlottie-android-${{ github.run_id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: unity/RLottieUnity/Library
          key: unity-library-${{ matrix.name }}-${{ hashFiles('unity/RLottieUnity/Packages/**', 'unity/RLottieUnity/ProjectSettings/**') }}
          restore-keys: unity-library-${{ matrix.name }}-

      - name: Build player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity/RLottieUnity
          targetPlatform: ${{ matrix.target_platform }}
          buildMethod: RLottie.CI.BuildMatrix.Build
          customParameters: >-
            -ciTarget ${{ matrix.ci_target }}
            -ciPipeline Auto
            -ciGraphicsApi ${{ matrix.graphics_api }}
            -ciOutputPath /github/workspace/${{ matrix.output }}

      - name: Upload player
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  linux_vulkan_smoke:
    name: Linux Vulkan native build and player smoke
    needs: build_players
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan build/runtime dependencies and X server
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build libgl-dev libvulkan-dev libvulkan1 mesa-vulkan-drivers vulkan-tools xvfb

      - name: Compile Linux native Vulkan backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cmake -S projects/CMake -B out/ci-linux-vulkan -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRLOTTIE_LINUX=ON | tee out/linux-vulkan-configure.log
          grep -F "Vulkan native texture upload enabled" out/linux-vulkan-configure.log
          cmake --build out/ci-linux-vulkan --parallel

      - name: Download Linux Vulkan player
        uses: actions/download-artifact@v4
        with:
          name: rlottie-linux-vulkan-${{ github.run_id }}
          path: artifacts/linux

      - name: Run Linux Vulkan smoke
        shell: bash
        run: |
          set -euo pipefail
          chmod +x artifacts/linux/RLottieSmoke.x86_64
          vulkaninfo --summary
          set +e
          # CPU-only hosted runners can spend about 40 seconds rejecting
          # llvmpipe Vulkan before Unity falls back to OpenGL. Leave enough
          # time for the rendered smoke itself after that initialization.
          timeout 90s xvfb-run -a artifacts/linux/RLottieSmoke.x86_64 \
            -force-vulkan \
            -screen-width 1280 \
            -screen-height 720 \
            -lottieSmokeResult "${PWD}/artifacts/linux/smoke-result.json" \
            -lottieSmokeQuit \
            -logFile "${PWD}/artifacts/linux/player.log"
          player_status=$?
          set -e
          if [[ ${player_status} -ne 0 ]]; then
            cat artifacts/linux/player.log
            test ! -f artifacts/linux/smoke-result.json || cat artifacts/linux/smoke-result.json
            exit ${player_status}
          fi
          jq --exit-status '
            .passed == true and
            ([.checks[] | select(.passed != true)] | length == 0) and
            (.graphicsApi != "Vulkan" or .animatedImageUploadBackend == "NativeVulkan")
          ' artifacts/linux/smoke-result.json

      - name: Upload Linux Vulkan smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlottie-linux-vulkan-smoke-${{ github.run_id }}
          path: |
            artifacts/linux/player.log
            artifacts/linux/smoke-result.json
          if-no-files-found: warn

  windows_native_smoke:
    name: Windows native rendered-player smoke
    needs: build_players
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rlottie-windows-${{ github.run_id }}
          path: artifacts/windows

      - name: Run rendered-player smoke test
        shell: pwsh
        run: >-
          ./scripts/ci/run-windows-player-smoke.ps1
          -Player artifacts/windows/RLottieSmoke.exe
          -LogFile artifacts/windows/Player.log
          -RequireNativeUpload

      - name: Upload player smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlottie-windows-native-smoke-${{ github.run_id }}
          path: |
            artifacts/windows/Player.log
            artifacts/windows/Player.log.smoke.json
          if-no-files-found: warn

  firebase_test_lab:
    name: Firebase Test Lab Android
    needs: build_players
    if: github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.run_physical_firebase_device)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: rlottie-android-${{ github.run_id }}
          path: artifacts/android

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Select Firebase device
        id: device
        shell: bash
        env:
          USE_PHYSICAL: ${{ inputs.run_physical_firebase_device || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$USE_PHYSICAL" == "true" ]]; then
            DEVICE_JSON="$(gcloud firebase test android list-device-capacities \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --filter='capacity=High' \
              --format=json \
              --limit=1)"
            MODEL="$(jq -r '.[0].model // empty' <<< "$DEVICE_JSON")"
            VERSION="$(jq -r '.[0].version // empty' <<< "$DEVICE_JSON")"
          else
            DEVICE_JSON="$(gcloud firebase test android models list \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --filter='id=MediumPhone.arm' \
              --format=json \
              --limit=1)"
            MODEL="$(jq -r '.[0].id // empty' <<< "$DEVICE_JSON")"
            VERSION="$(jq -r '.[0].supportedVersionIds[0] // empty' <<< "$DEVICE_JSON")"
          fi
          test -n "$MODEL"
          test -n "$VERSION"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run Firebase Robo smoke test
        shell: bash
        run: |
          set -euo pipefail
          gcloud firebase test android run \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --type=robo \
            --app=artifacts/android/RLottieSmoke.apk \
            --device="model=${{ steps.device.outputs.model }},version=${{ steps.device.outputs.version }},locale=en,orientation=portrait" \
            --timeout=5m \
            --client-details="matrixLabel=RLottie-${{ github.ref_name }}-${{ github.run_number }}"

  build_render_pipeline_players:
    name: Build device gate - ${{ matrix.pipeline }} ${{ matrix.platform }}
    if: github.event_name == 'workflow_dispatch' && inputs.run_physical_firebase_device
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - pipeline: BuiltIn
            platform: Windows64
            graphics_api: Auto
            ref: unity/6000.5.3f1
            target_platform: StandaloneWindows64
            output: artifacts/device-gate/windows-built-in/RLottieSmoke.exe
            artifact_path: artifacts/device-gate/windows-built-in
            artifact: rlottie-device-windows-built-in-${{ github.run_id }}
          - pipeline: URP
            platform: Windows64
            graphics_api: Auto
            ref: unity/6000.5.3f1-urp
            target_platform: StandaloneWindows64
            output: artifacts/device-gate/windows-urp/RLottieSmoke.exe
            artifact_path: artifacts/device-gate/windows-urp
            artifact: rlottie-device-windows-urp-${{ github.run_id }}
          - pipeline: HDRP
            platform: Windows64
            graphics_api: Auto
            ref: unity/6000.5.3f1-hdrp
            target_platform: StandaloneWindows64
            output: artifacts/device-gate/windows-hdrp/RLottieSmoke.exe
            artifact_path: artifacts/device-gate/windows-hdrp
            artifact: rlottie-device-windows-hdrp-${{ github.run_id }}
          - pipeline: BuiltIn
            platform: Android
            graphics_api: Vulkan
            ref: unity/6000.5.3f1
            target_platform: Android
            output: artifacts/device-gate/android-built-in/RLottieSmoke.apk
            artifact_path: artifacts/device-gate/android-built-in/RLottieSmoke.apk
            artifact: rlottie-device-android-built-in-${{ github.run_id }}
          - pipeline: URP
            platform: Android
            graphics_api: Vulkan
            ref: unity/6000.5.3f1-urp
            target_platform: Android
            output: artifacts/device-gate/android-urp/RLottieSmoke.apk
            artifact_path: artifacts/device-gate/android-urp/RLottieSmoke.apk
            artifact: rlottie-device-android-urp-${{ github.run_id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          submodules: recursive

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: unity/RLottieUnity/Library
          key: unity-device-gate-${{ matrix.pipeline }}-${{ matrix.platform }}-${{ hashFiles('unity/RLottieUnity/Packages/**', 'unity/RLottieUnity/ProjectSettings/**') }}
          restore-keys: unity-device-gate-${{ matrix.pipeline }}-${{ matrix.platform }}-

      - name: Build player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity/RLottieUnity
          targetPlatform: ${{ matrix.target_platform }}
          buildMethod: RLottie.CI.BuildMatrix.Build
          customParameters: >-
            -ciTarget ${{ matrix.platform }}
            -ciPipeline ${{ matrix.pipeline }}
            -ciGraphicsApi ${{ matrix.graphics_api }}
            -ciOutputPath /github/workspace/${{ matrix.output }}

      - name: Upload player
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  windows_render_pipeline_smoke:
    name: Windows rendered player - ${{ matrix.pipeline }}
    needs: build_render_pipeline_players
    if: github.event_name == 'workflow_dispatch' && inputs.run_physical_firebase_device
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pipeline: BuiltIn
            artifact: rlottie-device-windows-built-in-${{ github.run_id }}
          - pipeline: URP
            artifact: rlottie-device-windows-urp-${{ github.run_id }}
          - pipeline: HDRP
            artifact: rlottie-device-windows-hdrp-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/windows/${{ matrix.pipeline }}

      - name: Run rendered-player smoke test
        shell: pwsh
        run: >-
          ./scripts/ci/run-windows-player-smoke.ps1
          -Player artifacts/windows/${{ matrix.pipeline }}/RLottieSmoke.exe
          -LogFile artifacts/windows/${{ matrix.pipeline }}/Player.log

      - name: Upload player smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlottie-windows-${{ matrix.pipeline }}-device-log-${{ github.run_id }}
          path: |
            artifacts/windows/${{ matrix.pipeline }}/Player.log
            artifacts/windows/${{ matrix.pipeline }}/Player.log.smoke.json
          if-no-files-found: warn

  firebase_render_pipeline_devices:
    name: Android physical device - ${{ matrix.pipeline }}
    needs: build_render_pipeline_players
    if: github.event_name == 'workflow_dispatch' && inputs.run_physical_firebase_device
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - pipeline: BuiltIn
            artifact: rlottie-device-android-built-in-${{ github.run_id }}
          - pipeline: URP
            artifact: rlottie-device-android-urp-${{ github.run_id }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/android/${{ matrix.pipeline }}

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Select physical Firebase device
        id: device
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_JSON="$(gcloud firebase test android list-device-capacities \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --filter='capacity=High' \
            --format=json \
            --limit=1)"
          MODEL="$(jq -r '.[0].model // empty' <<< "$DEVICE_JSON")"
          VERSION="$(jq -r '.[0].version // empty' <<< "$DEVICE_JSON")"
          test -n "$MODEL"
          test -n "$VERSION"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run Firebase Robo smoke test
        shell: bash
        run: |
          set -euo pipefail
          gcloud firebase test android run \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --type=robo \
            --app="artifacts/android/${{ matrix.pipeline }}/RLottieSmoke.apk" \
            --device="model=${{ steps.device.outputs.model }},version=${{ steps.device.outputs.version }},locale=en,orientation=portrait" \
            --timeout=5m \
            --client-details="matrixLabel=RLottie-${{ matrix.pipeline }}-${{ github.run_number }}"
